# Local WordPress for developing the plugin.
#   cd dev && docker compose up -d && sh setup.sh
# Site: http://localhost:8097  (user admin, password in .data/admin-password.txt)
# Extra plugins to test alongside can be mounted in a git-ignored
# docker-compose.override.yml next to this file.
name: uaip-sfw-dev

x-wp-config-extra: &wp-config-extra |
  define( 'WP_ENVIRONMENT_TYPE', 'local' );
  define( 'WP_DEBUG_LOG', true );
  define( 'WP_DEBUG_DISPLAY', false );
  define( 'SCRIPT_DEBUG', true );
  // Local UAIP Security Cloud (uaip-security-cloud repo, port 8082).
  define( 'UAIP_SFW_CLOUD_URL', 'http://host.docker.internal:8082/api/v1' );
  define( 'UAIP_SFW_CLOUD_SITE', 'http://localhost:8082' );

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8097:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    volumes:
      - wp:/var/www/html
      - ../plugin:/var/www/html/wp-content/plugins/uaip-security-firewall
      - ../tests:/uaip-tests:ro
      - ./:/uaip-dev:ro

  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Same config as the web container, so CLI commands never fall back to production.
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    volumes:
      - wp:/var/www/html
      - ../plugin:/var/www/html/wp-content/plugins/uaip-security-firewall
      - ../tests:/uaip-tests:ro
      - ./:/uaip-dev:ro

volumes:
  db:
  wp:
